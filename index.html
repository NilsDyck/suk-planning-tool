<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUK-Planungstool – Soziotechnische Urteilskompetenz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════
       PAGE: Start (Group selection + Admin)
       ═══════════════════════════════════════════ -->
  <div id="page-start" class="page">
    <div class="start-container">
      <h1>SUK-Planungstool</h1>
      <p class="subtitle">Kollaborative Unterrichtsplanung für soziotechnische Urteilskompetenz</p>

      <div class="start-section">
        <h2>Gruppe wählen</h2>
        <div class="group-password-row">
          <input type="password" id="group-password" placeholder="Passwort eingeben">
          <button id="btn-group-unlock">Freischalten</button>
          <span id="group-password-error" class="group-password-error"></span>
        </div>
        <div id="group-grid" class="group-grid hidden">
          <!-- Generated by JS -->
        </div>
      </div>

      <div class="start-section admin-section">
        <button id="btn-admin-toggle" class="btn-admin-toggle">Admin-Modus</button>
        <div id="admin-panel" class="admin-panel hidden">
          <div class="admin-auth">
            <label for="admin-password">Passwort:</label>
            <input type="password" id="admin-password" placeholder="Passwort eingeben">
            <button id="btn-admin-login">Einloggen</button>
            <span id="admin-error" class="admin-error"></span>
          </div>
          <div id="admin-actions" class="admin-actions hidden">
            <p class="admin-info">Alle Gruppen exportieren:</p>
            <button id="btn-admin-save-all" class="btn-admin-action">Alle Gruppen als JSON speichern</button>
            <button id="btn-admin-pdf-all" class="btn-admin-action">Alle Gruppen als PDF generieren</button>
            <button id="btn-admin-clear-all" class="btn-admin-action btn-admin-danger">Alle Gruppen löschen</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       PAGE: Planning (Header + Body)
       ═══════════════════════════════════════════ -->
  <div id="page-planning" class="page hidden">

    <!-- ── Toolbar ── -->
    <div id="toolbar">
      <div id="toolbar-left">
        <button id="btn-back" class="btn-back">&#8592; Zurück</button>
        <span id="group-badge" class="group-badge">Gruppe <span id="group-badge-num"></span></span>
      </div>
      <div id="toolbar-right">
        <span id="status-indicator" style="font-size:0.85rem;color:#6b7280;margin-right:8px;"></span>
        <button id="btn-save" title="Als JSON exportieren">&#128190; Speichern</button>
        <button id="btn-import" title="JSON importieren">&#128192; Importieren</button>
        <button id="btn-pdf" title="Als PDF exportieren">&#128196; PDF</button>
        <input type="file" id="file-import" accept=".json" hidden>
      </div>
    </div>

    <!-- ── Header ── -->
    <header id="header">
      <div class="header-fields">
        <div class="field">
          <label for="problem-desc">Soziotechnisches Problem:</label>
          <textarea id="problem-desc" rows="3" placeholder="Beschreiben Sie das soziotechnische Problem&hellip;"></textarea>
        </div>

        <div class="field">
          <label>Jahrgangsstufe:</label>
          <div id="grade-levels">
            <label><input type="checkbox" name="grade" value="5"> 5</label>
            <label><input type="checkbox" name="grade" value="6"> 6</label>
            <label><input type="checkbox" name="grade" value="7"> 7</label>
            <label><input type="checkbox" name="grade" value="8"> 8</label>
            <label><input type="checkbox" name="grade" value="9"> 9</label>
            <label><input type="checkbox" name="grade" value="10"> 10</label>
            <label><input type="checkbox" name="grade" value="11"> 11</label>
            <label><input type="checkbox" name="grade" value="12"> 12</label>
            <label><input type="checkbox" name="grade" value="13"> 13</label>
          </div>
        </div>
      </div>
    </header>

    <!-- ── Body ── -->
    <main id="body">
      <div id="cards-toolbar">
        <button id="btn-add-card">+ Planungskarte hinzufügen</button>
      </div>

      <div id="cards-container" class="cards-grid">
        <!-- Cards are injected here by JS -->
      </div>
    </main>
  </div>

  <!-- ── PRINT TEMPLATE (hidden, used only for print/PDF) ── -->
  <div id="print-content" hidden></div>

  <script src="app.js"></script>
</body>
</html>
